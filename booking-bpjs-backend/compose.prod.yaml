services:
  web:
    build:
      context: .
      dockerfile: ./docker/production/nginx/Dockerfile
    restart: unless-stopped
    volumes:
      # Laravel source (read-only)
      - ./:/var/www/backend:ro

      # React build (read-only)
      - ../booking-bpjs-frontend/build:/var/www/frontend:ro

      # Laravel storage
      - laravel-storage-production:/var/www/storage:ro
    networks:
      - laravel-production
    ports:
      - "8080:80"
   

  php-fpm:
    # For the php-fpm service, we will create a custom image to install the necessary PHP extensions and setup proper permissions.
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: production # Use the 'production' stage in the Dockerfile
    restart: unless-stopped
    volumes:
      - laravel-storage-production:/var/www/storage # Mount the storage volume
    env_file:
      - .env
    networks:
      - laravel-production
networks:
 
  laravel-production:

volumes:
  laravel-storage-production: